# Mevcut Netlify Functions ayarlarınız (BUNLARA DOKUNMAYIN)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# YENİ EKLENEN PROXY YÖNLENDİRME KURALI
# Chatbot isteklerini Google Apps Script'e yönlendirir.
[[redirects]]
  from = "/api/chatbot"
  to = "https://script.google.com/macros/s/AKfycbxmODZr13UmoacRNBHJBD-cMp2wWVWmTDBxfSNi3j5-AjVWKlalldfQIBnuo_nI8cdH/exec" # EN SON ALDIĞINIZ APPS SCRIPT URL'Sİ
  status = 200 # Bu, isteği bir proxy gibi davranarak yönlendirir.